name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish charts
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          version="${TAG#v}"
          for chart in zitadel-operator zitadel-operator-crds; do
            helm package "charts/$chart" --version "$version" --app-version "$version" --destination dist
            helm push "dist/$chart-$version.tgz" oci://ghcr.io/linasvidziunas/charts
          done
